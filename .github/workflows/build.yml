name: Build

on:
  workflow_dispatch:
    inputs:
      game_package:
        description: 'Game Package Name'
        required: true
        default: 'com.DazadGame.LocalWarfareRePortable'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set game package name
      run: |
        sed -i 's/#define GamePackageName ".*"/#define GamePackageName "${{ github.event.inputs.game_package }}"/' module/src/main/cpp/game.h
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew module:assembleRelease --no-daemon
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-Il2CppDumper-${{ github.event.inputs.game_package }}
        path: out/*.zip
